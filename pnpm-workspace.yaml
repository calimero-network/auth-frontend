# Single-package repo. `packages:` is REQUIRED — pnpm 10+ refuses to run at all
# without it ("ERROR packages field missing or empty"), even though this file
# exists only to carry the security overrides below. `.` is the root itself.
packages:
  - "."

overrides:
  base-x@<=3.0.10: 3.0.11
  secp256k1@=5.0.0: '>=5.0.1'
