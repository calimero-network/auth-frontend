# Calimero Authentication Service Configuration
#
# Used by Dockerfile.auth.rebuild (standalone mero-auth with this repo's
# frontend embedded). This is a LOCAL TESTING config, but it is baked into an
# image that is easy to run anywhere — so it must be safe by default:
#   * CSP on (the login page handles the admin password and tokens)
#   * CORS limited to local dev origins, never allow_all_origins
#   * no mock token endpoint

# Server configuration
listen_addr = "0.0.0.0:3001"

# JWT token settings
[jwt]
issuer = "calimero-auth"
access_token_expiry = 1800          # 30 minutes
refresh_token_expiry = 2592000    # 30 days

# Storage configuration
[storage]
type = "rocksdb"
path = "./data/auth_db_local"

# CORS configuration
[cors]
# Local dev origins only. Add your app's origin here rather than opening CORS
# to every site: with allow_all_origins any page the user visits can drive
# this service from their browser.
allow_all_origins = false
allowed_origins = ["http://localhost:3001", "http://localhost:5173", "http://127.0.0.1:5173"]
allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allowed_headers = ["Authorization", "Content-Type", "Accept", "X-CSRF-Token"]
exposed_headers = ["X-Auth-Error"]
max_age = 100  # Match the accesscontrolmaxage from docker-compose
vary_header = true  # Match addvaryheader from docker-compose

# Security configuration
[security]
# Request size limits (in bytes)
max_body_size = 1048576          # 1MB default request body size limit

# Rate limiting settings
[security.rate_limit]
rate_limit_rpm = 300             # Requests per minute (increased from 50)
rate_limit_burst = 50            # Burst size for rate limiting (increased from 20)

# Security headers configuration
[security.headers]
enabled = true
hsts_max_age = 31536000         # 1 year in seconds
hsts_include_subdomains = true
frame_options = "DENY"          # DENY, SAMEORIGIN, or ALLOW-FROM
content_type_options = "nosniff"
referrer_policy = "strict-origin-when-cross-origin"

# Content Security Policy (core's defaults for the directives)
[security.headers.csp]
enabled = true

# Authentication providers configuration
[providers]
near_wallet = true
user_password = true

# NEAR wallet configuration
[near]
network = "testnet"
rpc_url = "https://rpc.testnet.near.org"
wallet_url = "https://wallet.testnet.near.org" 

# Username/password configuration
[user_password]
min_password_length = 8
max_password_length = 128

# Development/testing configuration
[development]
# Mock token endpoint OFF. It mints admin tokens to anyone presenting the
# configured header, and a value committed to a public repo is no secret.
# (The route is compiled only into debug builds, so a --release image never
# served it — keep it that way if someone rebuilds this in debug.)
enable_mock_auth = false
