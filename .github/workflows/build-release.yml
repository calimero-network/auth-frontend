name: Build and Release Project

on:
  workflow_dispatch:
  push:
    branches:
      # `master`, not `main`. This repo's default branch is master and there is
      # no `main`.
      #
      # ⚠️ This is the ONLY release trigger. There used to be a
      # `pull_request: closed` trigger with no branch filter, so merging a PR
      # into ANY branch (a feature branch, a stacked base, dependabot's)
      # rebuilt the bundle and re-pointed the release tag. core's
      # crates/auth/build.rs embeds whatever that tag points at into merod, so
      # that was a path from "merged into a side branch" to "served as /auth on
      # every node". A merge into master already fires `push`.
      - master

permissions:
  contents: write

# `push` and a manual dispatch can race; two runs must never both tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build_and_push:
    # A dispatch from a feature branch must not release it.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release tags are IMMUTABLE. core pins `v<version>` and downloads that
      # tag's archive, so re-pointing an existing tag silently changes what an
      # already-"pinned" core build embeds. A version that is already tagged is
      # therefore a no-op here: bump package.json to release.
      - name: Read version and check the tag is new
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::notice::v$VERSION is already tagged; nothing to release (bump package.json to cut a release)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.get_version.outputs.exists == 'false'
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Pinned, not `npm install -g pnpm`. Unpinned, CI silently follows whatever
      # pnpm published most recently — which is why this job succeeded in August
      # and failed in September with no change to the repo:
      #
      #   ERR_PNPM_OUTDATED_LOCKFILE
      #   help: Update your lockfile using "pnpm install --no-frozen-lockfile"
      #
      # pnpm 10 moved where `overrides` are read from, so a newer client
      # resolved a different tree than the committed lockfile. `packageManager`
      # in package.json is the source of truth; corepack honours it.
      - name: Install pnpm
        if: steps.get_version.outputs.exists == 'false'
        run: corepack enable && corepack prepare --activate

      - name: Install dependencies
        if: steps.get_version.outputs.exists == 'false'
        run: pnpm install

      - name: Build app
        if: steps.get_version.outputs.exists == 'false'
        run: pnpm build

      - name: Set up Git user
        if: steps.get_version.outputs.exists == 'false'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Push build folder to build branch
        if: steps.get_version.outputs.exists == 'false'
        run: |
          mkdir temp-deploy
          cp -r build temp-deploy/

          cd temp-deploy
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          git fetch origin

          git checkout build || git checkout -b build

          git add .
          git commit -m "Deploy build folder from commit $GITHUB_SHA"

          VERSION="v${{ steps.get_version.outputs.version }}"

          # Never delete or move an existing tag (see "check the tag is new").
          # A plain push of a tag that appeared since that check is refused by
          # the remote, which fails the run instead of re-pointing it.
          git tag "$VERSION"
          git push --force origin build
          git push origin "refs/tags/$VERSION"

      - name: Create GitHub release
        if: steps.get_version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          target_commitish: build
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
