name: Build and Release Project

on:
  workflow_dispatch:
  push:
    branches:
      # `master`, not `main`. This repo's default branch is master and there is
      # no `main`, so this trigger has never once fired — every release since
      # has depended on the `pull_request: closed` trigger below happening to
      # succeed.
      - master
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  build_and_push:
    if: github.event.pull_request.merged == true || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Pinned, not `npm install -g pnpm`. Unpinned, CI silently follows whatever
      # pnpm published most recently — which is why this job succeeded in August
      # and failed in September with no change to the repo:
      #
      #   ERR_PNPM_OUTDATED_LOCKFILE
      #   help: Update your lockfile using "pnpm install --no-frozen-lockfile"
      #
      # pnpm 10 moved where `overrides` are read from, so a newer client
      # resolved a different tree than the committed lockfile. `packageManager`
      # in package.json is the source of truth; corepack honours it.
      - name: Install pnpm
        run: corepack enable && corepack prepare --activate

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm build

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Git user
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Push build folder to build branch
        run: |
          mkdir temp-deploy
          cp -r build temp-deploy/

          cd temp-deploy
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          git fetch origin

          git checkout build || git checkout -b build

          git add .
          git commit -m "Deploy build folder from commit $GITHUB_SHA"

          VERSION="v${{ steps.get_version.outputs.version }}"

          # Delete local tag if exists
          git tag -d $VERSION 2>/dev/null || true

          # Delete remote tag if exists
          git push --delete origin $VERSION 2>/dev/null || true

          git tag $VERSION
          git push --force origin build
          git push origin $VERSION

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          target_commitish: build
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
